<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>

<body>

    <h1>Student Admission Form</h1>
    <p>Please fill in all the required details</p>

    <form>

        <!-- Personal Information -->
        <h2>Personal Information</h2>

        <label for="fname">First Name</label><br>
        <input type="text" id="fname" name="fname" placeholder="Enter first name" required>
        <br><br>

        <label for="lname">Last Name</label><br>
        <input type="text" id="lname" name="lname" placeholder="Enter last name" required>
        <br><br>

        <label for="dob">Date of Birth</label><br>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Contact Information -->
        <h2>Contact Information</h2>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email"
               placeholder="student@example.com" required>
        <br><br>

        <label for="phone">Phone Number</label><br>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter phone number" required>
        <br><br>

        <label for="address">Address</label><br>
        <textarea id="address" name="address"
                  placeholder="Enter complete address"
                  rows="4" cols="40" required></textarea>
        <br><br>

        <label for="city">City</label><br>
        <input type="text" id="city" name="city"
               placeholder="Enter city" required>
        <br><br>

        <label for="pin">PIN Code</label><br>
        <input type="text" id="pin" name="pin"
               placeholder="Enter PIN code" required>
        <br><br>

        <!-- Academic Information -->
        <h2>Academic Information</h2>

        <label for="qualification">Previous Qualification</label><br>
        <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="Diploma">Diploma</option>
            <option value="Degree">Degree</option>
        </select>
        <br><br>

        <label for="percentage">Percentage / CGPA</label><br>
        <input type="text" id="percentage" name="percentage"
               placeholder="Enter percentage or CGPA" required>
        <br><br>

        <label for="course">Course Applying For</label><br>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="B.Sc">B.Sc</option>
            <option value="B.Com">B.Com</option>
            <option value="BBA">BBA</option>
            <option value="MCA">MCA</option>
        </select>
        <br><br>

        <label for="year">Admission Year</label><br>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
        </select>
        <br><br>

        <!-- Parent / Guardian Information -->
        <h2>Parent / Guardian Information</h2>

        <label for="parent">Parent / Guardian Name</label><br>
        <input type="text" id="parent" name="parent"
               placeholder="Enter name" required>
        <br><br>

        <label for="parentphone">Parent Phone Number</label><br>
        <input type="tel" id="parentphone" name="parentphone"
               placeholder="Enter phone number" required>
        <br><br>

        <!-- Confirmation -->
        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">
            I confirm that the information provided above is correct and complete.
        </label>

        <br><br>

        <!-- Buttons -->
        <button type="reset">Reset</button>
        <button type="submit">Submit Application</button>

    </form>

</body>
</html>
